<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איפוס סיסמה - ועד 2025</title>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/belding-theme.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .logo h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .logo p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .form-input {
            width: 100%;
            padding: 12px 45px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }

        .alert-success {
            background: #c6f6d5;
            color: #2f855a;
            border: 1px solid #68d391;
        }

        .loading {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-requirements {
            background: #f7fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .password-requirements h4 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .password-requirements ul {
            list-style: none;
            color: #718096;
        }

        .password-requirements li {
            padding: 3px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-requirements li i {
            font-size: 12px;
        }

        .password-requirements li.valid {
            color: #48bb78;
        }

        .password-requirements li.valid i {
            color: #48bb78;
        }

        .success-box {
            text-align: center;
            display: none;
        }

        .success-box.active {
            display: block;
        }

        .success-box i {
            font-size: 60px;
            color: #48bb78;
            margin-bottom: 20px;
        }

        .success-box h2 {
            color: #2d3748;
            margin-bottom: 15px;
        }

        .success-box p {
            color: #718096;
            margin-bottom: 25px;
        }

        #resetForm.hidden {
            display: none;
        }
    </style>
    <!-- Tailwind CSS (Play CDN) + Hebrew RTL Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          fontFamily: {
            hebrew: ['Heebo', 'Assistant', 'Noto Sans Hebrew', 'sans-serif'],
          },
          lineHeight: {
            hebrew: '1.7',
            'hebrew-tight': '1.4',
          },
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',600:'#2563eb',700:'#1e40af',800:'#1d4ed8' }
          }
        }
      }
    }
    </script></head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <i class="fas fa-lock-open"></i>
            <h1>איפוס סיסמה</h1>
            <p>הזן סיסמה חדשה לחשבון שלך</p>
        </div>

        <!-- Alert Messages -->
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <!-- Reset Form -->
        <form id="resetForm">
            <div class="form-group">
                <label for="password">סיסמה חדשה</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('password', 'toggleIcon1')">
                        <i class="fas fa-eye" id="toggleIcon1"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">אימות סיסמה</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock icon"></i>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'toggleIcon2')">
                        <i class="fas fa-eye" id="toggleIcon2"></i>
                    </button>
                </div>
            </div>

            <div class="password-requirements">
                <h4><i class="fas fa-info-circle"></i> דרישות סיסמה:</h4>
                <ul>
                    <li id="req-length"><i class="fas fa-circle"></i> לפחות 6 תווים</li>
                    <li id="req-match"><i class="fas fa-circle"></i> הסיסמאות תואמות</li>
                </ul>
            </div>

            <button type="submit" class="btn btn-primary" id="resetBtn">
                <span id="resetBtnText"><i class="fas fa-save"></i> שמור סיסמה חדשה</span>
                <div class="loading" id="resetLoading">
                    <div class="spinner"></div>
                    <span>שומר...</span>
                </div>
            </button>
        </form>

        <!-- Success Message -->
        <div class="success-box" id="successBox">
            <i class="fas fa-check-circle"></i>
            <h2>הסיסמה עודכנה!</h2>
            <p>הסיסמה שלך עודכנה בהצלחה. עכשיו תוכל להתחבר עם הסיסמה החדשה.</p>
            <a href="login.html" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> התחבר עכשיו
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Toggle Password Visibility
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Show Alert
        function showAlert(message, type = 'error') {
            const alertElement = document.getElementById(type === 'error' ? 'errorAlert' : 'successAlert');
            const otherAlert = document.getElementById(type === 'error' ? 'successAlert' : 'errorAlert');
            
            otherAlert.style.display = 'none';
            alertElement.textContent = message;
            alertElement.style.display = 'block';
            
            setTimeout(() => {
                alertElement.style.display = 'none';
            }, 5000);
        }

        // Validate password requirements
        function validatePassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const reqLength = document.getElementById('req-length');
            const reqMatch = document.getElementById('req-match');
            
            // Check length
            if (password.length >= 6) {
                reqLength.classList.add('valid');
                reqLength.querySelector('i').classList.remove('fa-circle');
                reqLength.querySelector('i').classList.add('fa-check-circle');
            } else {
                reqLength.classList.remove('valid');
                reqLength.querySelector('i').classList.remove('fa-check-circle');
                reqLength.querySelector('i').classList.add('fa-circle');
            }
            
            // Check match
            if (password && confirmPassword && password === confirmPassword) {
                reqMatch.classList.add('valid');
                reqMatch.querySelector('i').classList.remove('fa-circle');
                reqMatch.querySelector('i').classList.add('fa-check-circle');
            } else {
                reqMatch.classList.remove('valid');
                reqMatch.querySelector('i').classList.remove('fa-check-circle');
                reqMatch.querySelector('i').classList.add('fa-circle');
            }
            
            return password.length >= 6 && password === confirmPassword;
        }

        // Add input listeners
        document.getElementById('password').addEventListener('input', validatePassword);
        document.getElementById('confirmPassword').addEventListener('input', validatePassword);

        // Handle Reset Form Submit
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('הסיסמאות אינן תואמות');
                return;
            }
            
            if (password.length < 6) {
                showAlert('הסיסמה חייבת להכיל לפחות 6 תווים');
                return;
            }
            
            // Show loading
            document.getElementById('resetBtnText').style.display = 'none';
            document.getElementById('resetLoading').classList.add('active');
            document.getElementById('resetBtn').disabled = true;
            
            try {
                await initSupabase();
                const supabase = getSupabase();
                
                if (!supabase) {
                    showAlert('שגיאה בחיבור לשרת');
                    return;
                }
                
                const { error } = await supabase.auth.updateUser({
                    password: password
                });
                
                if (error) {
                    showAlert(error.message || 'שגיאה בעדכון הסיסמה');
                    return;
                }
                
                // הצלחה - הצג הודעת הצלחה
                document.getElementById('resetForm').classList.add('hidden');
                document.getElementById('successBox').classList.add('active');
                
            } catch (error) {
                console.error('Reset password error:', error);
                showAlert('שגיאה בעדכון הסיסמה. נסה שוב.');
            } finally {
                // Hide loading
                document.getElementById('resetBtnText').style.display = 'inline-flex';
                document.getElementById('resetLoading').classList.remove('active');
                document.getElementById('resetBtn').disabled = false;
            }
        });

        // Initialize — מחכים לסשן אחרי redirect ממייל (PKCE / hash לוקחים רגע)
        window.addEventListener('DOMContentLoaded', async () => {
            await initSupabase();
            const supabase = getSupabase();
            if (!supabase) {
                showAlert('שגיאה בחיבור לשרת');
                document.getElementById('resetBtn').disabled = true;
                return;
            }

            let session = null;
            if (typeof finalizeAuthFromRedirectUrl === 'function') {
                session = await finalizeAuthFromRedirectUrl(supabase);
            } else {
                const { data: { session: s0 } } = await supabase.auth.getSession();
                session = s0;
            }

            if (!session) {
                const u = new URL(window.location.href);
                const hadRedirectAuth = !!(u.searchParams.get('code') || u.searchParams.get('token_hash')
                    || (window.location.hash && /access_token|type=recovery|refresh_token/i.test(window.location.hash)));
                if (hadRedirectAuth) {
                    showAlert('לא הצלחנו לאמת את הקישור. אם ביקשת איפוס ממחשב אחר ופתחת את המייל כאן — בקש מייל איפוס שוב מהמכשיר הזה, או פתח את הקישור באותו דפדפן שבו לחצת "שלח קישור".');
                } else {
                    showAlert('הקישור לא תקין או פג תוקף. בקש קישור חדש ממסך שכחתי סיסמה.');
                }
                document.getElementById('resetBtn').disabled = true;
            }
        });
    </script>
</body>
</html>
