<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e15">
    <title>שכחתי סיסמה - ועד 2025</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/belding-theme.css">
    
    <style>
        :root {
            --primary: #6366f1; 
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #ec4899; 
            --accent: #10b981; 
            --danger: #ef4444;
            --dark-bg: #0d0e15;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 24px;
        }

        /* Ambient Background */
        body::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            z-index: -1; pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 28px; color: white;
            box-shadow: 0 10px 20px var(--primary-glow);
            margin-bottom: 20px;
        }

        .auth-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px; font-weight: 700; margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted); font-size: 14px; line-height: 1.5;
        }

        .info-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13.5px;
            color: #a5b4fc;
            display: flex; gap: 10px; align-items: flex-start;
        }
        
        .info-box i { padding-top: 3px; }

        .form-group { margin-bottom: 24px; }
        
        .form-label {
            display: block; margin-bottom: 8px;
            font-size: 14px; font-weight: 500; color: var(--text-muted);
        }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        .input-icon {
            position: absolute; right: 16px; color: var(--text-muted); font-size: 16px; pointer-events: none; transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 44px 16px 20px;
            color: var(--text-main); font-family: inherit; font-size: 16px;
            outline: none; transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-input:focus + .input-icon { color: var(--primary); }
        .form-input::placeholder { color: #475569; }

        .btn {
            width: 100%; padding: 18px; border-radius: 16px;
            font-family: inherit; font-size: 16px; font-weight: 600;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s ease; margin-bottom: 24px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #818cf8); color: white;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.7; pointer-events: none; }

        .alert {
            padding: 14px 16px; border-radius: 12px; margin-bottom: 24px;
            font-size: 14px; display: none; align-items: center; gap: 10px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7;
        }

        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading { display: none; align-items: center; gap: 8px; }
        .loading.active { display: flex; }

        .back-link { text-align: center; }
        .back-link a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 15px; transition: color 0.3s; }
        .back-link a:hover { color: white; }

        /* Success Box */
        .success-box { text-align: center; display: none; margin-bottom: 24px; }
        .success-box.active { display: block; animation: slideUp 0.5s ease; }
        .success-box i { font-size: 64px; color: var(--accent); margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5)); }
        .success-box h2 { font-family: 'Outfit', sans-serif; font-size: 24px; color: white; margin-bottom: 12px; }
        .success-box p { color: var(--text-muted); font-size: 15px; margin-bottom: 30px; line-height: 1.6; }

        #resetForm.hidden { display: none; }

        @media (max-width: 480px) {
            .auth-container { padding: 32px 20px; }
        }
    </style>
    <!-- Tailwind CSS (Play CDN) + Hebrew RTL Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          fontFamily: {
            hebrew: ['Heebo', 'Assistant', 'Noto Sans Hebrew', 'sans-serif'],
          },
          lineHeight: {
            hebrew: '1.7',
            'hebrew-tight': '1.4',
          },
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',600:'#2563eb',700:'#1e40af',800:'#1d4ed8' }
          }
        }
      }
    }
    </script></head>
<body>
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <div class="logo-icon">
                <i class="fas fa-key"></i>
            </div>
            <h1>שכחתי סיסמה</h1>
            <p>אל דאגה, קורה לכולם. נשלח לך קישור לאיפוס.</p>
        </div>

        <!-- Alerts -->
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <!-- Info Box -->
        <div class="info-box" id="infoBox">
            <i class="fas fa-info-circle"></i>
            <span>הזן את כתובת האימייל שאיתה נרשמת, ונשלח לך קישור לאיפוס הסיסמה.</span>
        </div>

        <!-- Form -->
        <form id="resetForm">
            <div class="form-group">
                <label class="form-label" for="email">כתובת אימייל</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="resetBtn">
                <span id="resetBtnText">שלח קישור איפוס <i class="fas fa-paper-plane" style="margin-right: 8px;"></i></span>
                <div class="loading" id="resetLoading">
                    <div class="spinner"></div>
                </div>
            </button>
        </form>

        <!-- Success Message -->
        <div class="success-box" id="successBox">
            <i class="fas fa-check-circle"></i>
            <h2>הקישור בדרך אליך!</h2>
            <p>
                שלחנו אימייל עם קישור לאיפוס הסיסמה.<br>
                אם לא קיבלת, אנא בדוק בתיקיית הספאם (דואר זבל).
            </p>
            <a href="login.html" class="btn btn-primary">חזרה להתחברות <i class="fas fa-arrow-left" style="margin-right:8px;"></i></a>
        </div>

        <div class="back-link">
            <a href="login.html">חזרה למסך ההתחברות <i class="fas fa-arrow-left" style="margin-right: 6px; font-size:12px;"></i></a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        function showAlert(message, type = 'error') {
            const alertElement = document.getElementById(type === 'error' ? 'errorAlert' : 'successAlert');
            const otherAlert = document.getElementById(type === 'error' ? 'successAlert' : 'errorAlert');
            otherAlert.style.display = 'none';
            alertElement.textContent = message;
            alertElement.style.display = 'block';
            setTimeout(() => { alertElement.style.display = 'none'; }, 5000);
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            
            document.getElementById('resetBtnText').style.display = 'none';
            document.getElementById('resetLoading').classList.add('active');
            document.getElementById('resetBtn').disabled = true;
            
            try {
                await initSupabase();
                if (typeof resetPassword !== 'function') {
                    showAlert('שגיאה בטעינת המערכת. רענן את הדף.');
                    return;
                }
                const result = await resetPassword(email);
                if (!result.success) {
                    showAlert(result.error || 'שגיאה בשליחת האימייל');
                    return;
                }
                document.getElementById('resetForm').classList.add('hidden');
                document.getElementById('infoBox').style.display = 'none';
                document.getElementById('successBox').classList.add('active');
                document.querySelector('.back-link').style.display = 'none';
            } catch (error) {
                console.error('Reset password error:', error);
                showAlert('שגיאה בשליחת האימייל. נסה שוב.');
            } finally {
                document.getElementById('resetBtnText').style.display = 'inline-flex';
                document.getElementById('resetLoading').classList.remove('active');
                document.getElementById('resetBtn').disabled = false;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await initSupabase();
        });
    </script>
</body>
</html>
