<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>דשבורד - ועד 2025</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Heebo (Hebrew) + Inter (numbers/Latin) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/belding-theme.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', 'Assistant', sans-serif;
            background:
                radial-gradient(circle at 80% 0%, rgba(37, 99, 235, 0.12), transparent 40%),
                radial-gradient(circle at 20% 100%, rgba(16, 163, 74, 0.06), transparent 35%),
                linear-gradient(180deg, #f9fafb 0%, #eff6ff 100%);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            color: #111827;
            line-height: 1.7;
            word-spacing: 0.04em;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }
        
        .header h1 {
            color: #111827;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .header .welcome {
            color: #6b7280;
            font-size: 1.1rem;
            font-weight: 400;
        }
        
        .user-info-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            font-weight: 600;
        }
        
        /* Dashboard Grid */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            animation: fadeInUp 0.6s ease;
        }
        
        /* Tile Card */
        .tile {
            background: rgba(255,255,255,0.96);
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(15,23,42,0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 11.5rem;
        }
        
        .tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--tile-color, #2563eb);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .tile:hover {
            transform: translateY(-6px);
            border-color: rgba(37, 99, 235, 0.28);
            box-shadow: 0 18px 36px -24px rgba(15,23,42,0.45);
        }
        
        .tile:hover::before {
            transform: scaleX(1);
        }
        
        .tile:active {
            transform: translateY(-4px);
        }
        
        .tile-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            background: var(--tile-color, #2563eb);
            box-shadow: 0 8px 18px -12px rgba(15,23,42,0.5);
            transition: all 0.3s ease;
        }
        
        .tile:hover .tile-icon {
            transform: scale(1.06);
        }
        
        .tile-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .tile-subtitle {
            font-size: 0.85rem;
            color: #6b7280;
        }
        
        .tile-badge {
            position: absolute;
            inset-block-start: 12px;
            inset-inline-start: 12px; /* right side in RTL */
            background: #dc2626;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            animation: pulse 2.5s infinite;
        }
        
        /* Color Variants */
        .tile-dashboard { --tile-color: #2563eb; }
        .tile-tenants { --tile-color: #059669; }
        .tile-payments { --tile-color: #d97706; }
        .tile-expenses { --tile-color: #dc2626; }
        .tile-messages { --tile-color: #7c3aed; }
        .tile-reports { --tile-color: #0284c7; }
        .tile-settings { --tile-color: #6b7280; }
        .tile-profile { --tile-color: #2563eb; }
        
        /* Logout Button */
        .logout-btn {
            position: fixed;
            inset-block-start: 20px;
            inset-inline-end: 20px; /* left side in RTL */
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }
        
        .logout-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
            transform: translateY(-2px);
        }

        .tile:focus-visible,
        .logout-btn:focus-visible {
            outline: 3px solid #1d4ed8;
            outline-offset: 3px;
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .tiles-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .tile {
                padding: 20px 15px;
            }
            
            .tile-icon {
                width: 60px;
                height: 60px;
                font-size: 1.75rem;
            }
            
            .tile-title {
                font-size: 1rem;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .logout-btn {
                top: 12px;
                left: 12px;
                padding: 8px 12px;
                font-size: 0.85rem;
            }

            .user-info-top {
                max-width: 100%;
                padding: 12px;
                gap: 10px;
            }

            .user-avatar {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
        }
        
        @media (min-width: 768px) {
            .tiles-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            color: #1f2937;
            padding: 50px;
        }
        
        .spinner {
            border: 4px solid #dbeafe;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Tailwind CSS (Play CDN) + Hebrew RTL Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          fontFamily: {
            hebrew: ['Heebo', 'Assistant', 'Noto Sans Hebrew', 'sans-serif'],
          },
          lineHeight: {
            hebrew: '1.7',
            'hebrew-tight': '1.4',
          },
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',600:'#2563eb',700:'#1e40af',800:'#1d4ed8' }
          }
        }
      }
    }
    </script></head>
<body>
    <!-- Logout Button -->
    <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i>
        <span>התנתק</span>
    </button>

    <!-- Loading State -->
    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p>טוען נתונים...</p>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard-container" id="dashboardContent" style="display: none;">
        <!-- Header -->
        <div class="header">
            <h1>ועד 2025 - מערכת ניהול</h1>
            <p class="welcome">ברוך הבא! בחר את הפעולה הרצויה</p>
            
            <div class="user-info-top">
                <div class="user-avatar" id="userAvatar">ב</div>
                <div style="text-align: right;">
                    <div style="font-weight: 600;" id="userName">בועז סעדה</div>
                    <div style="font-size: 0.9rem; opacity: 0.9;" id="userEmail">boaz65sa@gmail.com</div>
                </div>
            </div>
        </div>

        <!-- Tiles Grid -->
        <div class="tiles-grid">
            <!-- Dashboard Overview -->
            <a href="overview-tiles.html" class="tile tile-dashboard">
                <div class="tile-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="tile-title">לוח מחוונים</div>
                <div class="tile-subtitle">סקירה כללית וגרפים</div>
            </a>

            <!-- Tenants -->
            <a href="tenants-tiles.html" class="tile tile-tenants">
                <span class="tile-badge" id="tenantsCount">0</span>
                <div class="tile-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="tile-title">דיירים</div>
                <div class="tile-subtitle">ניהול דיירים</div>
            </a>

            <!-- Payments -->
            <a href="payments-tiles.html" class="tile tile-payments">
                <span class="tile-badge" id="paymentsCount">0</span>
                <div class="tile-icon">
                    <i class="fas fa-credit-card"></i>
                </div>
                <div class="tile-title">תשלומים</div>
                <div class="tile-subtitle">חשבוניות ותשלומים</div>
            </a>

            <!-- Expenses -->
            <a href="expenses-tiles.html" class="tile tile-expenses">
                <div class="tile-icon">
                    <i class="fas fa-receipt"></i>
                </div>
                <div class="tile-title">הוצאות</div>
                <div class="tile-subtitle">ניהול הוצאות</div>
            </a>

            <!-- Messages -->
            <a href="messages-tiles.html" class="tile tile-messages">
                <div class="tile-icon">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <div class="tile-title">הודעות</div>
                <div class="tile-subtitle">הודעות לדיירים</div>
            </a>

            <!-- Reports -->
            <a href="overview-tiles.html" class="tile tile-reports">
                <div class="tile-icon">
                    <i class="fas fa-file-chart-line"></i>
                </div>
                <div class="tile-title">דוחות</div>
                <div class="tile-subtitle">דוחות וניתוחים</div>
            </a>

            <!-- Settings -->
            <a href="profile.html" class="tile tile-settings">
                <div class="tile-icon">
                    <i class="fas fa-cog"></i>
                </div>
                <div class="tile-title">הגדרות</div>
                <div class="tile-subtitle">הגדרות מערכת</div>
            </a>

            <!-- Profile -->
            <a href="profile.html" class="tile tile-profile">
                <div class="tile-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="tile-title">פרופיל</div>
                <div class="tile-subtitle">פרטים אישיים</div>
            </a>
        </div>
    </div>

    <!-- Supabase & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Initialize Dashboard
        (async function() {
            try {
                // Get Supabase client
                const supabase = await getSupabase();
                
                if (!supabase) {
                    window.location.href = 'login.html';
                    return;
                }

                // Check authentication
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error || !session) {
                    console.log('לא מחובר, מפנה ל-login');
                    window.location.href = 'login.html';
                    return;
                }

                const user = session.user;
                console.log('✅ משתמש מחובר:', user.email);

                // Get user profile
                const { data: profile, error: profileError } = await supabase
                    .from('user_profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (profile) {
                    console.log('✅ פרופיל נטען:', profile);
                    
                    // Update UI with user info
                    const displayName = profile.full_name || user.email?.split('@')[0] || 'משתמש';
                    const displayEmail = user.email || '';
                    
                    document.getElementById('userName').textContent = displayName;
                    document.getElementById('userEmail').textContent = displayEmail;
                    
                    // Set avatar initial
                    const initial = displayName.charAt(0).toUpperCase();
                    document.getElementById('userAvatar').textContent = initial;
                }

                // Load statistics from Supabase
                try {
                    // Count tenants
                    const { count: tenantsCount } = await supabase
                        .from('tenants')
                        .select('*', { count: 'exact', head: true });
                    
                    if (tenantsCount) {
                        document.getElementById('tenantsCount').textContent = tenantsCount;
                    }

                    // Count pending payments
                    const { count: paymentsCount } = await supabase
                        .from('payments')
                        .select('*', { count: 'exact', head: true })
                        .eq('status', 'pending');
                    
                    if (paymentsCount && paymentsCount > 0) {
                        document.getElementById('paymentsCount').textContent = paymentsCount;
                    } else {
                        document.getElementById('paymentsCount').style.display = 'none';
                    }
                } catch (statsError) {
                    console.warn('שגיאה בטעינת סטטיסטיקות:', statsError);
                    // Hide badges if data not available
                    document.getElementById('tenantsCount').style.display = 'none';
                    document.getElementById('paymentsCount').style.display = 'none';
                }

                // Show dashboard
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';

            } catch (error) {
                console.error('❌ שגיאה באתחול:', error);
                alert('שגיאה בטעינת הדשבורד');
                window.location.href = 'login.html';
            }
        })();

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (confirm('האם אתה בטוח שברצונך להתנתק?')) {
                try {
                    const supabase = await getSupabase();
                    if (supabase) {
                        await supabase.auth.signOut();
                    }
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('שגיאה בהתנתקות:', error);
                    alert('שגיאה בהתנתקות. מנסה שוב...');
                    window.location.href = 'login.html';
                }
            }
        });

        // Add click animation
        document.querySelectorAll('.tile').forEach(tile => {
            tile.addEventListener('click', function(e) {
                // Create ripple effect
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255,255,255,0.6)';
                ripple.style.width = ripple.style.height = '100px';
                ripple.style.left = e.offsetX - 50 + 'px';
                ripple.style.top = e.offsetY - 50 + 'px';
                ripple.style.animation = 'ripple 0.6s ease-out';
                ripple.style.pointerEvents = 'none';
                
                this.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
