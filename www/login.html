<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e15">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>כניסה - ועד 2025</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/belding-theme.css">
    
    <style>
        :root {
            --primary: #6366f1; /* Indigo */
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #ec4899; /* Pink */
            --accent: #10b981; /* Default success/emerald */
            --danger: #ef4444;
            --dark-bg: #0d0e15;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 24px;
        }

        /* Ambient Background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 10px 20px var(--primary-glow);
            margin-bottom: 20px;
        }

        .auth-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            inset-inline-start: 16px; /* right side in RTL */
            color: var(--text-muted);
            font-size: 18px;
            pointer-events: none;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 48px 16px 20px; /* inline padding handled below */
            padding-inline-start: 48px;   /* space for icon in RTL */
            padding-inline-end: 20px;
            color: var(--text-main);
            font-family: 'Heebo', sans-serif;
            font-size: 16px; /* Prevent iOS zoom */
            line-height: 1.7;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            min-height: 56px;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-input:focus + .input-icon {
            color: var(--primary);
        }

        .form-input::placeholder {
            color: #475569;
        }

        .password-toggle {
            position: absolute;
            inset-inline-end: 16px; /* left side in RTL */
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            min-height: 44px; /* touch target */
            display: flex;
            align-items: center;
        }

        .password-toggle:hover {
            color: var(--text-main);
        }

        /* Checkbox & Forgot */
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .remember-me input {
            appearance: none;
            width: 18px; height: 18px;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            background: var(--input-bg);
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: 0.2s;
        }

        .remember-me input::before {
            content: "";
            width: 10px; height: 10px;
            transform: scale(0);
            box-shadow: inset 1em 1em var(--primary);
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transition: 120ms transform ease-in-out;
        }

        .remember-me input:checked {
            background: var(--input-bg);
            border-color: var(--primary);
        }

        .remember-me input:checked::before {
            transform: scale(1);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-family: 'Heebo', sans-serif;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: white;
            box-shadow: 0 10px 20px var(--primary-glow);
            margin-bottom: 16px;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .divider {
            display: flex; align-items: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: var(--glass-border);
            margin: 0 16px;
        }

        .btn-google {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            backdrop-filter: blur(10px);
        }

        .btn-google:active {
            background: rgba(255,255,255,0.1);
        }

        .btn-google.oauth-social-margin {
            margin-bottom: 12px;
        }

        .btn-facebook {
            background: var(--glass-bg);
            border: 1px solid rgba(24, 119, 242, 0.35);
            color: var(--text-main);
            backdrop-filter: blur(10px);
        }

        .btn-facebook:active {
            background: rgba(24, 119, 242, 0.12);
        }

        /* Alerts */
        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        /* Bottom Links */
        .register-link {
            text-align: center;
            margin-top: 32px;
            font-size: 15px;
            color: var(--text-muted);
        }
        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .admin-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #fbbf24;
            font-size: 14px;
            text-decoration: none;
            opacity: 0.8;
        }

        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading { display: none; align-items: center; gap: 8px; }
        .loading.active { display: flex; }
    </style>
    <!-- Tailwind CSS (Play CDN) + Hebrew RTL Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          fontFamily: {
            hebrew: ['Heebo', 'Assistant', 'Noto Sans Hebrew', 'sans-serif'],
          },
          lineHeight: {
            hebrew: '1.7',
            'hebrew-tight': '1.4',
          },
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',600:'#2563eb',700:'#1e40af',800:'#1d4ed8' }
          }
        }
      }
    }
    </script></head>
<body>

    <div class="auth-container">
        
        <div class="auth-header">
            <div class="logo-icon">
                <i class="fas fa-building"></i>
            </div>
            <h1>כניסה למערכת</h1>
            <p>הזן שם משתמש וסיסמה</p>
        </div>

        <div class="alert alert-error" id="errorAlert">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">שם משתמש</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input" placeholder="שם משתמש" required autocomplete="username" autocapitalize="off">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">סיסמה</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="סיסמה" required autocomplete="current-password">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>זכור אותי</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span id="loginBtnText">התחבר</span>
                <div class="loading" id="loginLoading">
                    <div class="spinner"></div>
                </div>
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showAlert(message) {
            const alertEl = document.getElementById('errorAlert');
            document.getElementById('errorText').textContent = message;
            alertEl.style.display = 'flex';
            setTimeout(function () { alertEl.style.display = 'none'; }, 5000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            document.getElementById('loginBtnText').style.display = 'none';
            document.getElementById('loginLoading').classList.add('active');
            document.getElementById('loginBtn').disabled = true;

            try {
                const result = await login(username, password, rememberMe);
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    showAlert(result.error || 'שגיאה בהתחברות');
                }
            } catch (error) {
                showAlert('שגיאה בהתחברות');
            } finally {
                document.getElementById('loginBtnText').style.display = 'inline';
                document.getElementById('loginLoading').classList.remove('active');
                document.getElementById('loginBtn').disabled = false;
            }
        });

        window.addEventListener('DOMContentLoaded', async function () {
            const session = await getCurrentSession();
            if (session) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
