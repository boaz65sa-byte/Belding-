<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>הרשמה - ועד בית</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --secondary: #764ba2;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --radius: 16px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 16px;
            padding-top: 32px;
            padding-bottom: 32px;
        }

        .signup-container {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .logo-icon i {
            font-size: 28px;
            color: var(--white);
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .logo p {
            color: var(--gray);
            font-size: 14px;
        }

        /* Trial Badge */
        .trial-badge {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: var(--white);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Alert Messages */
        .alert {
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            color: var(--success);
            border: 1px solid #a7f3d0;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 600;
            font-size: 14px;
        }

        .form-group label .required {
            color: var(--danger);
            margin-right: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 16px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 14px 48px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: var(--light);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .password-toggle {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            padding: 8px;
            font-size: 16px;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
            border-radius: 2px;
        }

        .password-strength-bar.weak { width: 33%; background: var(--danger); }
        .password-strength-bar.medium { width: 66%; background: var(--warning); }
        .password-strength-bar.strong { width: 100%; background: var(--success); }

        .password-hint {
            font-size: 12px;
            color: var(--gray);
            margin-top: 6px;
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .checkbox-group label {
            font-size: 14px;
            color: var(--gray);
            line-height: 1.5;
        }

        .checkbox-group a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-google {
            background: var(--white);
            color: var(--dark);
            border: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .btn-google:hover {
            background: var(--light);
            transform: translateY(-2px);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            gap: 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            color: var(--gray);
            font-size: 13px;
            font-weight: 500;
        }

        /* Features List */
        .features-list {
            background: var(--light);
            padding: 18px;
            border-radius: var(--radius-sm);
            margin: 24px 0;
        }

        .features-list h3 {
            color: var(--dark);
            font-size: 15px;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--gray);
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-item i {
            color: var(--success);
            font-size: 16px;
        }

        /* Login Link */
        .login-link {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        .login-link p {
            color: var(--gray);
            font-size: 14px;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Loading */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-top: 20px;
            }

            .signup-container {
                padding: 24px 20px;
            }

            .logo-icon {
                width: 56px;
                height: 56px;
            }

            .logo h1 {
                font-size: 22px;
            }

            .form-input {
                padding: 12px 44px;
            }

            .btn {
                padding: 14px 20px;
            }

            .trial-badge {
                font-size: 14px;
                padding: 12px 16px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-bottom: max(32px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-building"></i>
            </div>
            <h1>ועד בית</h1>
            <p>הצטרף למערכת ניהול הדיירים החכמה</p>
        </div>

        <!-- Trial Badge -->
        <div class="trial-badge">
            <i class="fas fa-gift"></i>
            14 ימי ניסיון חינם - ללא כרטיס אשראי!
        </div>

        <!-- Google Signup -->
        <button type="button" class="btn btn-google" id="googleSignupBtn" onclick="handleGoogleSignup()">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            הירשם עם Google
        </button>

        <div class="divider"><span>או הירשם עם אימייל</span></div>

        <!-- Alert Messages -->
        <div class="alert alert-error" id="errorAlert">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>
        <div class="alert alert-success" id="successAlert">
            <i class="fas fa-check-circle"></i>
            <span id="successText"></span>
        </div>

        <!-- Signup Form -->
        <form id="signupForm">
            <div class="form-group">
                <label for="fullName"><span class="required">*</span> שם מלא</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" class="form-input" placeholder="שם פרטי ומשפחה" required autocomplete="name">
                    <i class="fas fa-user icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email"><span class="required">*</span> אימייל</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" placeholder="your@email.com" required autocomplete="email" inputmode="email">
                    <i class="fas fa-envelope icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">טלפון (אופציונלי)</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" class="form-input" placeholder="05X-XXXXXXX" autocomplete="tel" inputmode="tel">
                    <i class="fas fa-phone icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="buildingAddress"><span class="required">*</span> כתובת הבניין</label>
                <div class="input-wrapper">
                    <input type="text" id="buildingAddress" class="form-input" placeholder="לדוגמה: ברזל 15, תל אביב" required>
                    <i class="fas fa-building icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password"><span class="required">*</span> סיסמה</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="לפחות 6 תווים" required autocomplete="new-password">
                    <i class="fas fa-lock icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword('password', 'toggleIcon1')">
                        <i class="fas fa-eye" id="toggleIcon1"></i>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="password-hint" id="strengthText">הזן סיסמה חזקה</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><span class="required">*</span> אימות סיסמה</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" class="form-input" placeholder="הזן שוב את הסיסמה" required autocomplete="new-password">
                    <i class="fas fa-lock icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'toggleIcon2')">
                        <i class="fas fa-eye" id="toggleIcon2"></i>
                    </button>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">
                    אני מסכים ל<a href="#">תנאי השימוש</a> ו<a href="#">מדיניות הפרטיות</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" id="signupBtn">
                <span id="signupBtnText"><i class="fas fa-user-plus"></i> הירשם עכשיו</span>
                <div class="loading" id="signupLoading">
                    <div class="spinner"></div>
                    <span>רושם...</span>
                </div>
            </button>
        </form>

        <!-- Features -->
        <div class="features-list">
            <h3>מה מקבלים בתקופת הניסיון:</h3>
            <div class="feature-item"><i class="fas fa-check-circle"></i> <span>גישה מלאה לכל התכונות</span></div>
            <div class="feature-item"><i class="fas fa-check-circle"></i> <span>ניהול דיירים ותשלומים</span></div>
            <div class="feature-item"><i class="fas fa-check-circle"></i> <span>דוחות ויצוא נתונים</span></div>
            <div class="feature-item"><i class="fas fa-check-circle"></i> <span>תמיכה טכנית מלאה</span></div>
        </div>

        <!-- Login Link -->
        <div class="login-link">
            <p>כבר יש לך חשבון? <a href="login.html">התחבר כאן</a></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Toggle Password
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Show Alert
        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById(type === 'error' ? 'errorAlert' : 'successAlert');
            const textEl = document.getElementById(type === 'error' ? 'errorText' : 'successText');
            const otherAlert = document.getElementById(type === 'error' ? 'successAlert' : 'errorAlert');
            
            otherAlert.style.display = 'none';
            textEl.textContent = message;
            alertEl.style.display = 'flex';
            
            setTimeout(() => { alertEl.style.display = 'none'; }, 5000);
        }

        // Google Signup
        async function handleGoogleSignup() {
            await initSupabase();
            const btn = document.getElementById('googleSignupBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="border-color: #e2e8f0; border-top-color: #667eea;"></div> מתחבר...';
            
            try {
                const result = await signInWithGoogle();
                if (!result.success) {
                    showAlert(result.error || 'שגיאה בהרשמה עם Google');
                    btn.disabled = false;
                    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> הירשם עם Google';
                }
            } catch (error) {
                showAlert('שגיאה בהרשמה עם Google');
                btn.disabled = false;
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> הירשם עם Google';
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            await initSupabase();
            
            const session = await getCurrentSession();
            if (session) window.location.href = 'index.html';

            // Password Strength
            document.getElementById('password').addEventListener('input', (e) => {
                const password = e.target.value;
                const strengthBar = document.getElementById('strengthBar');
                const strengthText = document.getElementById('strengthText');
                
                let strength = 0;
                if (password.length >= 6) strength++;
                if (password.length >= 10) strength++;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
                if (/\d/.test(password)) strength++;
                if (/[^a-zA-Z\d]/.test(password)) strength++;
                
                strengthBar.className = 'password-strength-bar';
                if (strength <= 2) {
                    strengthBar.classList.add('weak');
                    strengthText.textContent = 'סיסמה חלשה';
                    strengthText.style.color = '#ef4444';
                } else if (strength <= 4) {
                    strengthBar.classList.add('medium');
                    strengthText.textContent = 'סיסמה בינונית';
                    strengthText.style.color = '#f59e0b';
                } else {
                    strengthBar.classList.add('strong');
                    strengthText.textContent = 'סיסמה חזקה!';
                    strengthText.style.color = '#10b981';
                }
            });

            // Form Submit
            document.getElementById('signupForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const fullName = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim() || null;
                const buildingAddress = document.getElementById('buildingAddress').value.trim();
                const password = document.getElementById('password').value;
                const confirmPass = document.getElementById('confirmPassword').value;
                const terms = document.getElementById('agreeTerms').checked;

                if (fullName.length < 2) return showAlert('נא להזין שם מלא');
                if (!buildingAddress) return showAlert('נא להזין כתובת בניין');
                if (password.length < 6) return showAlert('סיסמה קצרה מדי (מינימום 6 תווים)');
                if (password !== confirmPass) return showAlert('הסיסמאות אינן תואמות');
                if (!terms) return showAlert('חובה לאשר תנאי שימוש');

                document.getElementById('signupBtnText').style.display = 'none';
                document.getElementById('signupLoading').classList.add('active');
                document.getElementById('signupBtn').disabled = true;

                try {
                    const result = await signupWithBuilding(email, password, fullName, phone, buildingAddress);

                    if (result.success) {
                        showAlert('נרשמת בהצלחה! מעביר...', 'success');
                        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                    } else {
                        showAlert(result.error || 'שגיאה ברישום');
                    }
                } catch (error) {
                    showAlert('שגיאה: ' + error.message);
                } finally {
                    document.getElementById('signupBtnText').style.display = 'inline';
                    document.getElementById('signupLoading').classList.remove('active');
                    document.getElementById('signupBtn').disabled = false;
                }
            });
        });
    </script>
</body>
</html>
