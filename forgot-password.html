<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איפוס סיסמה - ועד 2025</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 450px; width: 100%; padding: 40px; text-align: center; }
        h1 { color: #2d3748; margin-bottom: 10px; font-size: 24px; }
        p { color: #718096; margin-bottom: 30px; font-size: 15px; }
        .form-input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 20px; font-size: 16px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #667eea; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #5a67d8; }
        .back-link { display: block; margin-top: 20px; color: #718096; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <i class="fas fa-lock" style="font-size: 40px; color: #667eea; margin-bottom: 20px;"></i>
        <h1>שכחת סיסמה?</h1>
        <p>הכנס את האימייל שלך ונשלח לך קישור לאיפוס הסיסמה.</p>
        
        <form id="resetForm">
            <input type="email" id="email" class="form-input" placeholder="האימייל שלך" required>
            <button type="submit" class="btn" id="resetBtn">שלח קישור לאיפוס</button>
        </form>

        <a href="login.html" class="back-link">חזרה להתחברות</a>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('resetBtn');
            
            btn.textContent = 'שולח...';
            btn.disabled = true;

            try {
                // קריאה לפונקציה החדשה שנוסיף ל-auth.js
                const result = await window.resetPassword(email);
                
                if (result.success) {
                    alert('נשלח מייל לאיפוס סיסמה! בדוק את תיבת הדואר שלך.'); 
                    window.location.href = 'login.html';
                } else {
                    alert('שגיאה: ' + result.error);
                }
            } catch (error) {
                alert('שגיאה: ' + error.message);
            } finally {
                btn.textContent = 'שלח קישור לאיפוס';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
