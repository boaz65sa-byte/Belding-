<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות מנהל - ועד 2025</title>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo .crown {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .logo i.fa-shield-alt {
            font-size: 50px;
            color: #f59e0b;
            margin-bottom: 15px;
        }

        .logo h1 {
            font-size: 26px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .logo p {
            color: #718096;
            font-size: 14px;
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .form-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .password-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #f59e0b;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-admin {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-admin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }

        .alert-success {
            background: #c6f6d5;
            color: #2f855a;
            border: 1px solid #68d391;
        }

        .loading {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .security-note {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .security-note i {
            font-size: 18px;
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo -->
        <div class="logo">
            <div class="crown">👑</div>
            <i class="fas fa-shield-alt"></i>
            <h1>פאנל ניהול</h1>
            <p>גישה למנהלים מורשים בלבד</p>
            <span class="admin-badge"><i class="fas fa-lock"></i> אזור מוגן</span>
        </div>

        <!-- Security Note -->
        <div class="security-note">
            <i class="fas fa-exclamation-triangle"></i>
            <span>דף זה מיועד למנהלי מערכת בלבד. ניסיונות גישה לא מורשים נרשמים.</span>
        </div>

        <!-- Alert Messages -->
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <!-- Admin Login Form -->
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email"><i class="fas fa-user-shield"></i> אימייל מנהל</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="admin@example.com"
                        required
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-key"></i> סיסמה</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-admin" id="loginBtn">
                <span id="loginBtnText"><i class="fas fa-sign-in-alt"></i> התחבר כמנהל</span>
                <div class="loading" id="loginLoading">
                    <div class="spinner"></div>
                    <span>מאמת הרשאות...</span>
                </div>
            </button>
        </form>

        <div class="back-link">
            <a href="login.html"><i class="fas fa-arrow-right"></i> חזרה להתחברות רגילה</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Show Alert
        function showAlert(message, type = 'error') {
            const alertElement = document.getElementById(type === 'error' ? 'errorAlert' : 'successAlert');
            const otherAlert = document.getElementById(type === 'error' ? 'successAlert' : 'errorAlert');
            
            otherAlert.style.display = 'none';
            alertElement.textContent = message;
            alertElement.style.display = 'block';
            
            setTimeout(() => {
                alertElement.style.display = 'none';
            }, 5000);
        }

        // Handle Admin Login Form Submit
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Show loading
            document.getElementById('loginBtnText').style.display = 'none';
            document.getElementById('loginLoading').classList.add('active');
            document.getElementById('loginBtn').disabled = true;
            
            try {
                // התחברות רגילה
                const result = await login(email, password, false);
                
                if (!result.success) {
                    showAlert(result.error || 'שגיאה בהתחברות. נסה שוב.');
                    return;
                }
                
                // בדיקה אם המשתמש הוא אדמין
                const user = await getCurrentUser();
                if (!user) {
                    showAlert('שגיאה באימות המשתמש');
                    return;
                }
                
                const profile = await getUserProfile(user.id);
                
                if (!profile) {
                    showAlert('לא נמצא פרופיל משתמש');
                    await signOut();
                    return;
                }
                
                // בדיקת הרשאות אדמין
                if (profile.role !== 'admin' && profile.role !== 'super_admin') {
                    showAlert('אין לך הרשאות מנהל. גישה נדחתה.');
                    await signOut();
                    return;
                }
                
                // הצלחה - מעבר לפאנל אדמין
                showAlert('התחברת בהצלחה! מעביר לפאנל ניהול...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);
                
            } catch (error) {
                console.error('Admin login error:', error);
                showAlert('שגיאה בהתחברות. בדוק את החיבור לאינטרנט.');
            } finally {
                // Hide loading
                document.getElementById('loginBtnText').style.display = 'inline-flex';
                document.getElementById('loginLoading').classList.remove('active');
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // Check if already logged in as admin
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initSupabase();
                const session = await getCurrentSession();
                
                if (session) {
                    const user = await getCurrentUser();
                    if (user) {
                        const profile = await getUserProfile(user.id);
                        if (profile && (profile.role === 'admin' || profile.role === 'super_admin')) {
                            // כבר מחובר כאדמין - עבור לפאנל
                            window.location.href = 'admin.html';
                        }
                    }
                }
            } catch (error) {
                console.error('Error checking session:', error);
            }
        });
    </script>
</body>
</html>
