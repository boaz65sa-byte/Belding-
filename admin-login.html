<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>התחברות מנהל - ועד בית</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/belding-theme.css">
    
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --dark: #1a1a2e;
            --dark-light: #16213e;
            --success: #10b981;
            --danger: #ef4444;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
            padding: 32px 24px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4);
            font-size: 32px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .logo p {
            color: var(--gray);
            font-size: 14px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .security-note {
            background: #fef3c7;
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .security-note i {
            font-size: 20px;
            color: var(--primary);
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            color: var(--success);
            border: 1px solid #a7f3d0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 18px;
        }

        .form-input {
            width: 100%;
            padding: 16px 50px 16px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
            background: var(--light);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            padding: 8px;
            font-size: 18px;
        }

        .forgot-link {
            text-align: left;
            margin-bottom: 20px;
        }

        .forgot-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-admin {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
        }

        .btn-admin:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .login-container {
                padding: 28px 20px;
            }

            .logo-icon {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }

            .logo h1 {
                font-size: 22px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }
        }
    </style>
    <!-- Tailwind CSS (Play CDN) + Hebrew RTL Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          fontFamily: {
            hebrew: ['Heebo', 'Assistant', 'Noto Sans Hebrew', 'sans-serif'],
          },
          lineHeight: {
            hebrew: '1.7',
            'hebrew-tight': '1.4',
          },
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',600:'#2563eb',700:'#1e40af',800:'#1d4ed8' }
          }
        }
      }
    }
    </script></head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">👑</div>
            <h1>פאנל ניהול</h1>
            <p>גישה למנהלים מורשים בלבד</p>
            <span class="admin-badge"><i class="fas fa-lock"></i> אזור מוגן</span>
        </div>

        <div class="security-note">
            <i class="fas fa-exclamation-triangle"></i>
            <span>דף זה מיועד למנהלי מערכת בלבד</span>
        </div>

        <div class="alert alert-error" id="errorAlert">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>
        <div class="alert alert-success" id="successAlert">
            <i class="fas fa-check-circle"></i>
            <span id="successText"></span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">אימייל מנהל</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" placeholder="admin@example.com" required autocomplete="email" inputmode="email">
                    <i class="fas fa-envelope icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">סיסמה</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <i class="fas fa-lock icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="forgot-link">
                <a href="forgot-password.html"><i class="fas fa-key"></i> שכחתי סיסמה</a>
            </div>

            <button type="submit" class="btn btn-admin" id="loginBtn">
                <span id="loginBtnText"><i class="fas fa-sign-in-alt"></i> התחבר כמנהל</span>
                <div class="loading" id="loginLoading">
                    <div class="spinner"></div>
                    <span>מאמת הרשאות...</span>
                </div>
            </button>
        </form>

        <div class="back-link">
            <a href="login.html"><i class="fas fa-arrow-right"></i> חזרה להתחברות רגילה</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById(type === 'error' ? 'errorAlert' : 'successAlert');
            const textEl = document.getElementById(type === 'error' ? 'errorText' : 'successText');
            const otherAlert = document.getElementById(type === 'error' ? 'successAlert' : 'errorAlert');
            
            otherAlert.style.display = 'none';
            textEl.textContent = message;
            alertEl.style.display = 'flex';
            
            setTimeout(() => { alertEl.style.display = 'none'; }, 5000);
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            document.getElementById('loginBtnText').style.display = 'none';
            document.getElementById('loginLoading').classList.add('active');
            document.getElementById('loginBtn').disabled = true;
            
            try {
                const result = await login(email, password, false);
                
                if (!result.success) {
                    showAlert(result.error || 'שגיאה בהתחברות');
                    return;
                }
                
                const user = await getCurrentUser();
                if (!user) {
                    showAlert('שגיאה באימות המשתמש');
                    return;
                }
                
                const profile = await getUserProfile(user.id);
                
                if (!profile) {
                    showAlert('לא נמצא פרופיל משתמש');
                    await signOut();
                    return;
                }
                
                if (profile.role !== 'super_admin') {
                    showAlert('אין לך הרשאות מנהל ראשי. רק boaz65sa@gmail.com יכול לגשת.');
                    await signOut();
                    return;
                }
                
                showAlert('התחברת בהצלחה! מעביר...', 'success');
                setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
                
            } catch (error) {
                showAlert('שגיאה בהתחברות. בדוק את החיבור לאינטרנט.');
            } finally {
                document.getElementById('loginBtnText').style.display = 'inline-flex';
                document.getElementById('loginLoading').classList.remove('active');
                document.getElementById('loginBtn').disabled = false;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initSupabase();
                const session = await getCurrentSession();
                
                if (session) {
                    const user = await getCurrentUser();
                    if (user) {
                        const profile = await getUserProfile(user.id);
                        if (profile && profile.role === 'super_admin') {
                            window.location.href = 'admin.html';
                        }
                    }
                }
            } catch (error) {
                console.error('Error checking session:', error);
            }
        });
    </script>
</body>
</html>
