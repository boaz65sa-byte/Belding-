<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>לוח מחוונים - ועד 2025</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    
    <!-- Tiles Style -->
    <link rel="stylesheet" href="css/tiles-style.css">
    <link rel="stylesheet" href="css/belding-theme.css">
    
    <style>
        .chart-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
        }
        
        .chart-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chart-wrapper {
            position: relative;
            height: 300px;
        }
        
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--bg-light);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .activity-item:hover {
            background: #e5e7eb;
            transform: translateX(5px);
        }
        
        .activity-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .activity-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        @media (max-width: 768px) {
            .chart-wrapper {
                height: 250px;
            }
        }
    </style>
    <!-- Tailwind CSS (Play CDN) + Hebrew RTL Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          fontFamily: {
            hebrew: ['Heebo', 'Assistant', 'Noto Sans Hebrew', 'sans-serif'],
          },
          lineHeight: {
            hebrew: '1.7',
            'hebrew-tight': '1.4',
          },
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',600:'#2563eb',700:'#1e40af',800:'#1d4ed8' }
          }
        }
      }
    }
    </script></head>
<body>
    <!-- Loading State -->
    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p>טוען נתונים...</p>
    </div>

    <!-- Main Content -->
    <div class="tiles-container" id="mainContent" style="display: none;">
        <!-- Top Bar -->
        <div class="top-bar">
            <a href="dashboard-tiles.html" class="back-btn">
                <i class="fas fa-arrow-right"></i>
                <span>חזרה לתפריט</span>
            </a>
            
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span>התנתק</span>
            </button>
        </div>

        <!-- Header -->
        <div class="tiles-header">
            <h1><i class="fas fa-chart-line"></i> לוח מחוונים</h1>
            <p class="subtitle">סקירה כוללת של המערכת</p>
        </div>

        <!-- Main Statistics -->
        <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
            <div class="stat-card">
                <div class="stat-icon" style="background: var(--success);">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-value" id="totalTenants">0</div>
                <div class="stat-label">דיירים</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: var(--primary);">
                    <i class="fas fa-shekel-sign"></i>
                </div>
                <div class="stat-value" id="monthlyIncome">₪0</div>
                <div class="stat-label">הכנסות החודש</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: var(--danger);">
                    <i class="fas fa-receipt"></i>
                </div>
                <div class="stat-value" id="monthlyExpenses">₪0</div>
                <div class="stat-label">הוצאות החודש</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: var(--info);">
                    <i class="fas fa-balance-scale"></i>
                </div>
                <div class="stat-value" id="balance">₪0</div>
                <div class="stat-label">יתרה</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: var(--warning);">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-value" id="pendingPayments">0</div>
                <div class="stat-label">תשלומים ממתינים</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: var(--purple);">
                    <i class="fas fa-building"></i>
                </div>
                <div class="stat-value" id="totalApartments">0</div>
                <div class="stat-label">דירות</div>
            </div>
        </div>

        <!-- Charts Row 1 -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px;">
            <!-- Income vs Expenses Chart -->
            <div class="chart-container">
                <div class="chart-title">
                    <i class="fas fa-chart-bar" style="color: var(--primary);"></i>
                    <span>הכנסות מול הוצאות - 6 חודשים אחרונים</span>
                </div>
                <div class="chart-wrapper">
                    <canvas id="incomeExpensesChart"></canvas>
                </div>
            </div>

            <!-- Payment Status Chart -->
            <div class="chart-container">
                <div class="chart-title">
                    <i class="fas fa-chart-pie" style="color: var(--success);"></i>
                    <span>סטטוס תשלומים</span>
                </div>
                <div class="chart-wrapper">
                    <canvas id="paymentStatusChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Charts Row 2 -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px;">
            <!-- Expenses by Category -->
            <div class="chart-container">
                <div class="chart-title">
                    <i class="fas fa-chart-doughnut" style="color: var(--warning);"></i>
                    <span>הוצאות לפי קטגוריה</span>
                </div>
                <div class="chart-wrapper">
                    <canvas id="expensesCategoryChart"></canvas>
                </div>
            </div>

            <!-- Collection Rate -->
            <div class="chart-container">
                <div class="chart-title">
                    <i class="fas fa-chart-line" style="color: var(--info);"></i>
                    <span>אחוז גביה - 6 חודשים</span>
                </div>
                <div class="chart-wrapper">
                    <canvas id="collectionRateChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="chart-container">
            <div class="chart-title">
                <i class="fas fa-history" style="color: var(--purple);"></i>
                <span>פעילות אחרונה</span>
            </div>
            <div class="activity-list" id="activityList">
                <!-- Activities will be loaded here -->
            </div>
        </div>

        <!-- Quick Actions -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 30px;">
            <a href="tenants-tiles.html" class="btn btn-primary btn-lg" style="justify-content: center;">
                <i class="fas fa-users"></i>
                <span>ניהול דיירים</span>
            </a>
            <a href="payments-tiles.html" class="btn btn-success btn-lg" style="justify-content: center;">
                <i class="fas fa-credit-card"></i>
                <span>ניהול תשלומים</span>
            </a>
            <a href="expenses-tiles.html" class="btn btn-danger btn-lg" style="justify-content: center;">
                <i class="fas fa-receipt"></i>
                <span>ניהול הוצאות</span>
            </a>
            <a href="reports-tiles.html" class="btn btn-info btn-lg" style="justify-content: center;">
                <i class="fas fa-file-chart-line"></i>
                <span>דוחות</span>
            </a>
        </div>
    </div>

    <!-- Supabase & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tiles-app.js"></script>

    <script>
        let charts = {};
        
        // ===== Initialize =====
        window.addEventListener('DOMContentLoaded', async () => {
            const initialized = await window.TilesApp.init();
            if (!initialized) return;
            
            await loadDashboardData();
        });

        // ===== Load Dashboard Data =====
        async function loadDashboardData() {
            try {
                window.TilesApp.showLoading('טוען נתונים...');
                
                // Load all data in parallel
                const [tenants, payments, expenses] = await Promise.all([
                    window.TilesApp.supabase.from('tenants').select('*'),
                    window.TilesApp.supabase.from('payments').select('*'),
                    window.TilesApp.supabase.from('expenses').select('*')
                ]);
                
                const tenantsData = tenants.data || [];
                const paymentsData = payments.data || [];
                const expensesData = expenses.data || [];
                
                updateStatistics(tenantsData, paymentsData, expensesData);
                createCharts(paymentsData, expensesData);
                loadRecentActivity(paymentsData, expensesData);
                
                window.TilesApp.hideLoading();
                
            } catch (error) {
                console.error('❌ שגיאה בטעינת נתונים:', error);
                window.TilesApp.handleError(error, 'שגיאה בטעינת הנתונים');
                window.TilesApp.hideLoading();
            }
        }

        // ===== Update Statistics =====
        function updateStatistics(tenants, payments, expenses) {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            // Total tenants
            document.getElementById('totalTenants').textContent = tenants.length;
            
            // Total apartments
            const apartments = new Set(tenants.map(t => t.apartment_number)).size;
            document.getElementById('totalApartments').textContent = apartments;
            
            // Monthly income
            const monthlyIncome = payments
                .filter(p => {
                    const date = new Date(p.payment_date);
                    return p.status === 'paid' && 
                           date.getMonth() === currentMonth && 
                           date.getFullYear() === currentYear;
                })
                .reduce((sum, p) => sum + (p.amount || 0), 0);
            
            document.getElementById('monthlyIncome').textContent = window.formatCurrency(monthlyIncome);
            
            // Monthly expenses
            const monthlyExpenses = expenses
                .filter(e => {
                    const date = new Date(e.expense_date);
                    return date.getMonth() === currentMonth && 
                           date.getFullYear() === currentYear;
                })
                .reduce((sum, e) => sum + (e.amount || 0), 0);
            
            document.getElementById('monthlyExpenses').textContent = window.formatCurrency(monthlyExpenses);
            
            // Balance
            const balance = monthlyIncome - monthlyExpenses;
            document.getElementById('balance').textContent = window.formatCurrency(balance);
            document.getElementById('balance').style.color = balance >= 0 ? 'var(--success)' : 'var(--danger)';
            
            // Pending payments
            const pending = payments.filter(p => p.status === 'pending').length;
            document.getElementById('pendingPayments').textContent = pending;
        }

        // ===== Create Charts =====
        function createCharts(payments, expenses) {
            createIncomeExpensesChart(payments, expenses);
            createPaymentStatusChart(payments);
            createExpensesCategoryChart(expenses);
            createCollectionRateChart(payments);
        }

        // Chart 1: Income vs Expenses
        function createIncomeExpensesChart(payments, expenses) {
            const months = getLast6Months();
            const incomeData = months.map(month => {
                return payments
                    .filter(p => p.status === 'paid' && p.billing_month === month)
                    .reduce((sum, p) => sum + (p.amount || 0), 0);
            });
            
            const expensesData = months.map(month => {
                const [year, m] = month.split('-');
                return expenses
                    .filter(e => {
                        const date = new Date(e.expense_date);
                        return date.getFullYear() === parseInt(year) && 
                               date.getMonth() + 1 === parseInt(m);
                    })
                    .reduce((sum, e) => sum + (e.amount || 0), 0);
            });
            
            const ctx = document.getElementById('incomeExpensesChart').getContext('2d');
            charts.incomeExpenses = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months.map(m => formatMonthLabel(m)),
                    datasets: [{
                        label: 'הכנסות',
                        data: incomeData,
                        backgroundColor: 'rgba(16, 185, 129, 0.8)',
                        borderColor: 'rgb(16, 185, 129)',
                        borderWidth: 2
                    }, {
                        label: 'הוצאות',
                        data: expensesData,
                        backgroundColor: 'rgba(239, 68, 68, 0.8)',
                        borderColor: 'rgb(239, 68, 68)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '₪' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        // Chart 2: Payment Status
        function createPaymentStatusChart(payments) {
            const paid = payments.filter(p => p.status === 'paid').length;
            const pending = payments.filter(p => p.status === 'pending').length;
            const overdue = payments.filter(p => p.status === 'overdue').length;
            
            const ctx = document.getElementById('paymentStatusChart').getContext('2d');
            charts.paymentStatus = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['שולם', 'ממתין', 'באיחור'],
                    datasets: [{
                        data: [paid, pending, overdue],
                        backgroundColor: [
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(239, 68, 68, 0.8)'
                        ],
                        borderColor: [
                            'rgb(16, 185, 129)',
                            'rgb(245, 158, 11)',
                            'rgb(239, 68, 68)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Chart 3: Expenses by Category
        function createExpensesCategoryChart(expenses) {
            const categories = {};
            expenses.forEach(e => {
                const cat = e.category || 'other';
                categories[cat] = (categories[cat] || 0) + (e.amount || 0);
            });
            
            const labels = Object.keys(categories).map(getCategoryLabel);
            const data = Object.values(categories);
            const colors = [
                'rgba(102, 126, 234, 0.8)',
                'rgba(245, 158, 11, 0.8)',
                'rgba(139, 92, 246, 0.8)',
                'rgba(6, 182, 212, 0.8)',
                'rgba(16, 185, 129, 0.8)',
                'rgba(239, 68, 68, 0.8)',
                'rgba(236, 72, 153, 0.8)',
                'rgba(107, 114, 128, 0.8)'
            ];
            
            const ctx = document.getElementById('expensesCategoryChart').getContext('2d');
            charts.expensesCategory = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Chart 4: Collection Rate
        function createCollectionRateChart(payments) {
            const months = getLast6Months();
            const rateData = months.map(month => {
                const monthPayments = payments.filter(p => p.billing_month === month);
                if (monthPayments.length === 0) return 0;
                const paid = monthPayments.filter(p => p.status === 'paid').length;
                return Math.round((paid / monthPayments.length) * 100);
            });
            
            const ctx = document.getElementById('collectionRateChart').getContext('2d');
            charts.collectionRate = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months.map(m => formatMonthLabel(m)),
                    datasets: [{
                        label: 'אחוז גביה',
                        data: rateData,
                        borderColor: 'rgb(6, 182, 212)',
                        backgroundColor: 'rgba(6, 182, 212, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        // ===== Load Recent Activity =====
        function loadRecentActivity(payments, expenses) {
            const activities = [];
            
            // Add payments
            payments.slice(0, 5).forEach(p => {
                activities.push({
                    type: 'payment',
                    title: `תשלום התקבל`,
                    time: p.payment_date,
                    icon: 'fa-credit-card',
                    color: 'var(--success)'
                });
            });
            
            // Add expenses
            expenses.slice(0, 5).forEach(e => {
                activities.push({
                    type: 'expense',
                    title: `הוצאה: ${e.description}`,
                    time: e.expense_date,
                    icon: 'fa-receipt',
                    color: 'var(--danger)'
                });
            });
            
            // Sort by date
            activities.sort((a, b) => new Date(b.time) - new Date(a.time));
            
            // Display
            const list = document.getElementById('activityList');
            list.innerHTML = activities.slice(0, 10).map(activity => `
                <div class="activity-item">
                    <div class="activity-icon" style="background: ${activity.color};">
                        <i class="fas ${activity.icon}"></i>
                    </div>
                    <div class="activity-content">
                        <div class="activity-title">${activity.title}</div>
                        <div class="activity-time">${window.formatDate(activity.time)}</div>
                    </div>
                </div>
            `).join('');
        }

        // ===== Helper Functions =====
        function getLast6Months() {
            const months = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                months.push(`${year}-${month}`);
            }
            return months;
        }

        function formatMonthLabel(monthStr) {
            const [year, month] = monthStr.split('-');
            return `${month}/${year.slice(2)}`;
        }

        function getCategoryLabel(category) {
            const labels = {
                'maintenance': 'תחזוקה',
                'cleaning': 'ניקיון',
                'electricity': 'חשמל',
                'water': 'מים',
                'gardening': 'גינון',
                'security': 'אבטחה',
                'insurance': 'ביטוח',
                'repairs': 'תיקונים',
                'supplies': 'ציוד',
                'other': 'אחר'
            };
            return labels[category] || category;
        }
    </script>
</body>
</html>
